# Shared color list. Define a color once here and reuse it in any product:
#   options:
#     color: [navy, gray, white]
# id:   used in product files, photo names (navy-1.jpg) and URLs (?color=navy)
# code: used to build SKUs (BED-CMF7-NVY-QN); must be unique in this file
# hex:  swatch color shown on the site

